[project]
name = "ch1tp"
version = "0.1.0"
description = "API REST d'annuaire d'étudiants (TP CI/CD chapitre 1)"
readme = "README.md"
authors = [
    { name = "eladji", email = "149376126+Eladji@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ch1tp = "ch1tp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/ch1tp --cov-report=term-missing --cov-branch --cov-fail-under=80"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # erreurs pycodestyle (indentation, espaces, ligne trop longue)
    "W",    # avertissements pycodestyle
    "F",    # pyflakes (imports et variables inutilisés)
    "I",    # isort (ordre des imports)
    "UP",   # pyupgrade (syntaxe moderne)
    "B",    # flake8-bugbear (pièges courants)
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (pas de print() oublié)
    "RET",  # flake8-return
    "C4",   # comprehensions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
omit = ["src/ch1tp/__main__.py"]
